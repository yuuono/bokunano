<rect x="607.85" y="232" width="257.15" height="48" fill="#f97316"/>
<text x="736.43" y="261" text-anchor="middle" fill="#fff" class="axis">37.8%</text>
<rect x="185" y="323" width="14" height="14" fill="#64748b"/>
<text x="207" y="335" class="axis">制御token</text>
