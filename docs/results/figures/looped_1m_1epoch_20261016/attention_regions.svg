<rect x="655.84" y="88" width="209.16" height="48" fill="#f97316"/>
<text x="760.42" y="117" text-anchor="middle" fill="#fff" class="axis">30.8%</text>
<text x="173" y="190" text-anchor="end" class="axis">3層×2周</text>
<rect x="185.00" y="160" width="224.05" height="48" fill="#64748b"/>
<text x="297.02" y="189" text-anchor="middle" fill="#fff" class="axis">32.9%</text>
<rect x="409.05" y="160" width="203.01" height="48" fill="#2563eb"/>
<text x="510.56" y="189" text-anchor="middle" fill="#fff" class="axis">29.9%</text>
<rect x="612.06" y="160" width="252.94" height="48" fill="#f97316"/>
<text x="738.53" y="189" text-anchor="middle" fill="#fff" class="axis">37.2%</text>
<text x="173" y="262" text-anchor="end" class="axis">3層×3周</text>
<rect x="185.00" y="232" width="224.89" height="48" fill="#64748b"/>
<text x="297.44" y="261" text-anchor="middle" fill="#fff" class="axis">33.1%</text>
<rect x="409.89" y="232" width="197.96" height="48" fill="#2563eb"/>
