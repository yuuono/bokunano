version: 1

model:
  vocab_size: 2048
  d_model: 384
  n_layers: 8
  n_heads: 6
  d_ff: 1024
  context_length: 256
  dropout: 0.0
  rope_base: 10000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: false

model_validation:
  expected_parameter_count: 15735168

tokenizer:
  path: data/tokenizers/bpe_2048/tokenizer.json
  expected_sha256: 6840a392e8fcae1083be06842774fa912a1797217c7033944ba2d87f1c227293
  special_tokens:
    pad:
      token: <|pad|>
      id: 0
    bos:
