<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Boku1-nanoをブラウザ内のONNX Runtimeで動かすコード生成デモ" />
    <title>Boku1-nano デモ</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./vendor/ort.webgpu.min.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <header class="hero">
        <h1>Boku1-nano デモ</h1>
        <p class="lead">日本語の指示から<code>solve(xs, k)</code>形式のPythonコードを生成します。</p>
        <p class="privacy">推論はブラウザ内で実行され、入力内容は外部へ送信されません。</p>
      </header>

      <section class="panel" aria-labelledby="generator-title">
        <h2 id="generator-title">コードを生成</h2>
        <label for="model">使用するモデル</label>
        <select id="model" disabled></select>

        <label for="example">入力例を選ぶ</label>
        <select id="example">
          <option value="">選択してください</option>
          <optgroup label="2操作の組み合わせ">
            <option value="xsの各要素を絶対値にして降順に並べるsolve関数を書いてください。">絶対値にして、降順に並べる</option>
            <option value="整数リストxsと整数kを受け取り、各要素からkを引いて、数を2倍にするsolve関数を書いてください。">kを引いて、2倍する</option>
            <option value="整数リストxsと整数kを受け取り、正の値を選んで、前k個を切り出すsolve関数を書いてください。">正の値を選んで、先頭k個を取る</option>
            <option value="整数リストxsと整数kを受け取り、終わりからk個を引き出して、負の数だけを残すことにするsolve関数を書いてください。">末尾k個を取って、負の数だけを残す</option>
            <option value="整数リストxsから数の正負を切り替えて、数の絶対値を求めるsolve関数を書いてください。">符号を反転して、絶対値にする</option>
            <option value="整数リストxsと整数kを受け取り、末尾からk個を切り出して、kを差し引くsolve関数を書いてください。">末尾k個を取って、kを引く</option>
          </optgroup>
          <optgroup label="3操作の組み合わせ">
            <option value="整数リストxsと整数kを受け取り、すべての数を三倍して、数の正負を切り替えて、k未満の値を選ぶsolve関数を書いてください。">3倍して、符号を反転し、k未満を残す</option>
            <option value="整数リストxsと整数kを受け取り、値を降順に配置して、前k個を取って、k以下のものだけを残すsolve関数を書いてください。">降順にして、先頭k個を取り、k以下を残す</option>
            <option value="整数リストxsから偶数だけを切り出して、数列の各元を2倍にして、要素を三倍するsolve関数を書いてください。">偶数を残して、2倍し、3倍する</option>
            <option value="整数リストxsと整数kを受け取り、隔番に収集して、各値にkを乗じて、各データをkで引くsolve関数を書いてください。">1個おきに取り、k倍して、kを引く</option>
            <option value="整数リストxsと整数kを受け取り、k未満の値を抜き出して、全ての数の絶対値を求めて、正負を変えるsolve関数を書いてください。">k未満を残して、絶対値にし、符号を反転する</option>
            <option value="整数リストxsと整数kを受け取り、k以上のものを残し、kより大きい値を取得して、値を高める順に並べるsolve関数を書いてください。">k以上を残して、kより大きを選び、昇順にする</option>
          </optgroup>
          <optgroup label="抽出">
            <option value="整数リストxsから偶数だけを残すsolve関数を書いてください。">偶数だけを残す</option>
            <option value="整数リストxsから奇数だけを残すsolve関数を書いてください。">奇数だけを残す</option>
            <option value="整数リストxsからkより大きい値だけを残すsolve関数を書いてください。">kより大きい値だけを残す</option>
            <option value="整数リストxsからk以上の値だけを残すsolve関数を書いてください。">k以上の値だけを残す</option>
            <option value="整数リストxsからkより小さい値だけを残すsolve関数を書いてください。">kより小さい値だけを残す</option>
            <option value="整数リストxsからk以下の値だけを残すsolve関数を書いてください。">k以下の値だけを残す</option>
            <option value="整数リストxsからkの倍数だけを残すsolve関数を書いてください。">kの倍数だけを残す</option>
            <option value="整数リストxsから正の値だけを残すsolve関数を書いてください。">正の値だけを残す</option>
            <option value="整数リストxsから負の値だけを残すsolve関数を書いてください。">負の値だけを残す</option>
            <option value="整数リストxsからゼロだけを残すsolve関数を書いてください。">ゼロだけを残す</option>
          </optgroup>
          <optgroup label="変換">
            <option value="整数リストxsの各要素にkを加えるsolve関数を書いてください。">各要素にkを加える</option>
            <option value="整数リストxsの各要素からkを引くsolve関数を書いてください。">各要素からkを引く</option>
            <option value="整数リストxsの各要素にkを掛けるsolve関数を書いてください。">各要素にkを掛ける</option>
            <option value="整数リストxsの各要素を2倍するsolve関数を書いてください。">各要素を2倍する</option>
            <option value="整数リストxsの各要素を3倍するsolve関数を書いてください。">各要素を3倍する</option>
            <option value="整数リストxsの各要素の符号を反転するsolve関数を書いてください。">各要素の符号を反転する</option>
            <option value="整数リストxsの各要素の絶対値を取るsolve関数を書いてください。">各要素の絶対値を取る</option>
            <option value="整数リストxsの各要素を二乗するsolve関数を書いてください。">各要素を二乗する</option>
          </optgroup>
          <optgroup label="並べ替え">
            <option value="整数リストxsを値の昇順に並べるsolve関数を書いてください。">値を昇順に並べる</option>
            <option value="整数リストxsを値の降順に並べるsolve関数を書いてください。">値を降順に並べる</option>
            <option value="整数リストxsの現在の要素順を反転するsolve関数を書いてください。">現在の要素順を反転する</option>
          </optgroup>
          <optgroup label="切り出し">
            <option value="整数リストxsの先頭からk個を取るsolve関数を書いてください。">先頭からk個を取る</option>
            <option value="整数リストxsの末尾からk個を取るsolve関数を書いてください。">末尾からk個を取る</option>
            <option value="整数リストxsを先頭から1個おきに取るsolve関数を書いてください。">先頭から1個おきに取る</option>
          </optgroup>
        </select>

        <label for="prompt">日本語の指示</label>
        <textarea id="prompt" rows="5" maxlength="600">xsの各要素を絶対値にして降順に並べるsolve関数を書いてください。</textarea>
        <p class="hint">2操作・3操作の例も選択できます。処理は文章に書かれた順番で実行されます。</p>

        <div class="actions">
          <button id="generate" class="primary" type="button" disabled>コードを生成</button>
          <button id="stop" type="button" hidden>中止</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">初期化しています…</p>
      </section>

      <section class="panel output-panel" aria-labelledby="output-title">
        <div class="output-heading">
          <h2 id="output-title">生成結果</h2>
          <span id="metrics" class="metrics"></span>
        </div>
        <pre><code id="output">ここにモデルが生成したコードが表示されます。</code></pre>
      </section>

      <section class="about" aria-labelledby="about-title">
        <h2 id="about-title">このデモについて</h2>
        <p>入力例と自由入力は、どちらも同じBPEトークナイザとONNXモデルで処理します。入力例ごとの固定回答は使用していません。</p>
        <p>対象領域は整数リストを扱う小さな関数です。生成コードは実行前に内容を確認してください。</p>
      </section>
    </main>
  </body>
</html>
