<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Boku1-nanoをブラウザ内のONNX Runtimeで動かすコード生成デモ" />
    <title>Boku1-nano — ブラウザコード生成</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./vendor/ort.webgpu.min.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">LOCAL ONNX INFERENCE</p>
        <h1>Boku1-nano</h1>
        <p class="lead">日本語の指示から、<code>solve(xs, k)</code>形式のPythonコードを生成します。</p>
        <p class="privacy">モデルの読み込み後、推論はすべてブラウザ内で実行されます。入力内容はサーバーへ送信されません。</p>
      </header>

      <section class="panel" aria-labelledby="generator-title">
        <h2 id="generator-title">コードを生成</h2>
        <label for="model">使用するモデル</label>
        <select id="model" disabled></select>

        <label for="prompt">日本語の指示</label>
        <textarea id="prompt" rows="5" maxlength="600">整数リストxsから偶数だけを残すsolve関数を書いてください。</textarea>
        <div class="examples" aria-label="入力例">
          <button type="button" data-example="整数リストxsから偶数だけを残すsolve関数を書いてください。">偶数を残す</button>
          <button type="button" data-example="xsの各要素を絶対値にして降順に並べるsolve関数を書いてください。">絶対値で降順</button>
          <button type="button" data-example="xsからk以上の値だけを取り出し、先頭からk個を返してください。">条件抽出と先頭k個</button>
        </div>

        <div class="actions">
          <button id="generate" class="primary" type="button" disabled>モデルでコードを生成</button>
          <button id="stop" type="button" hidden>中止</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">初期化しています…</p>
      </section>

      <section class="panel output-panel" aria-labelledby="output-title">
        <div class="output-heading">
          <h2 id="output-title">生成結果</h2>
          <span id="metrics" class="metrics"></span>
        </div>
        <pre><code id="output">ここにモデルが生成したコードが表示されます。</code></pre>
      </section>

      <section class="about" aria-labelledby="about-title">
        <h2 id="about-title">このデモについて</h2>
        <p>入力例も自由入力も、同じBPEトークナイザとONNXモデルを通ります。固定回答の検索や、例文ごとの条件分岐は使用していません。</p>
        <p>対象領域は整数リストを扱う小さな関数です。生成コードは実行前に必ず内容を確認してください。</p>
      </section>
    </main>
  </body>
</html>
