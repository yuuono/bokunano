name: GitHub PagesへONNXデモを公開

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tests/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: CNLと温度サンプリングを検証
        run: node --test tests/web/*.test.mjs
      - name: Pagesを設定
        uses: actions/configure-pages@v5
      - name: 公開用ファイルを準備（実行比較ツールを除外）
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          shutil.copytree(
              "web", Path(os.environ["RUNNER_TEMP"]) / "bokunano-pages",
              ignore=shutil.ignore_patterns(
                  "code-verification.js", "verification-worker.js",
                  "verification_runtime.py", "reference_interpreter.py", "__pycache__",
              ),
          )
          PY
      - name: 静的サイトをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/bokunano-pages
      - name: Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
